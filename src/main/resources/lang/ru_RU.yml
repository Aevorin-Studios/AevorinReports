# Доступные плейсхолдеры (не все плейсхолдеры работают в каждом сообщении):
# {reporter} - Имя игрока, создавшего репорт
# {reported} - Имя игрока, на которого отправлен репорт
# {target}   - Целевой игрок (зачастую совпадает с reported)
# {reason}   - Указанная причина репорта
# {status}   - Текущий статус репорта (например: Ожидает, Решён)
# {color}    - Цветовой код, соответствующий статусу репорта
# {id}       - Уникальный числовой ID репорта
# {server}   - Сервер, на котором был создан репорт
# {index}    - Порядковый номер в списках
# {total}    - Общее количество репортов, страниц или элементов
# {page}     - Текущий номер страницы в GUI
# {start}    - Начальный индекс элемента на странице
# {end}      - Конечный индекс элемента на странице
# {category} - Название категории репорта
# {time}     - Оставшееся время задержки (cooldown)
# {date}     - Дата и время создания репорта
#
# Поддерживает теги MiniMessage (например, <rainbow>, <red>, <gradient:blue:aqua>)
# Также поддерживаются классические цветовые коды &.

config-version: 4

# Настройки интерфейса GUI
# Содержит форматирование текста для интерактивных меню плагина.
gui:
  # Книжный интерфейс (Book GUI)
  # Используется, когда параметр gui.type установлен на "book" в config.yml.
  # Примечание: Используйте '\n' для переноса строки в книгах!
  book:
    error_creating: "&cОшибка при создании интерфейса книги."
    reporting_header: "&4Репорт на игрока:\n&c{target}"
    reasons_header: "&4Причины:"
    custom_reason: "&c• Своя причина"
    back_button: "\n&8« Назад к категориям"
    page:
      title: "&cДетали репорта\n\n"
      reporter: "&7Репортёр: &a{reporter}\n"
      reported: "&7Нарушитель: &c{reported}\n"
      reason: "&7Причина: "
      reason_hover: "&cНаведите для просмотра"
      reason_hover_content: "&f{reason}"
      status: "&7Статус: {color}{status}\n"
      id: "&7ID: &0{id}"
      server: "&7Сервер: &c{server}\n"
      created_at: "&7Создан: &0{date}\n"
      updated_at: "&7Обновлён: &0{date}\n"
      last_updated_by: "&7Изменил: &0{name}\n"
      click_to_change: "\n&8Нажмите для смены статуса\n"
      reports_category_header: "&4Категории репортов\n\n"
      view_details: "&7Нажмите для просмотра"
    status_options:
      pending: "&6⚠ Отметить как ожидающий\n"
      resolved: "&a✔ Отметить как решённый\n"
      rejected: "&c✘ Отклонить репорт\n"
    hover_text:
      report_for: "&7Нажмите, чтобы отправить репорт за: &f{category}"
      custom_reason: "&7Нажмите, чтобы указать свою причину"
      pending: "&7Нажмите, чтобы вернуть в ожидание"
      resolved: "&7Нажмите, чтобы отметить как решённый"
      rejected: "&7Нажмите, чтобы отклонить"
      back: "&7Нажмите, чтобы вернуться к категориям репортов"
    main_menu:
      pending:
        title: "&6• Ожидающие репорты"
        hover: "&7Нажмите для просмотра"
      resolved:
        title: "&a• Решённые репорты"
        hover: "&7Нажмите для просмотра"
      rejected:
        title: "&c• Отклонённые репорты"
        hover: "&7Нажмите для просмотра"
    report_list:
      title: "&4Репорты: {status}\n"
      total: "&7Всего: {total}\n\n"
      entry: "&4{index}. &c{reported}"
      user_title: "&4Ваши репорты\n"
      user_entry: "&4{index}. &c{reported} {color}({status})"

  # Контейнерный GUI (Интерфейс сундука)
  # Используется, когда параметр gui.type установлен на "container" в config.yml.
  container:
    shared:
      separator: "&8&m                                          &r"
      navigation:
        page_indicator:
          title: "&fСтраница {page} из {total}"
          lore: "&7Показано {start}-{end} из {total} репортов"
        previous_page:
          title: "&eПредыдущая страница"
          lore: "&7Перейти на страницу {page}"
        next_page:
          title: "&eСледующая страница"
          lore: "&7Перейти на страницу {page}"
        back_button:
          title: "&eНазад"
          lore: "&7Вернуться к категориям"

    menus:
      main_menu:
        title: "Меню репортов"
        pending:
          title: "&6Ожидающие репорты"
          lore:
            description: "&7Просмотр всех ожидающих репортов."
            action: "&eНажмите для просмотра!"
        resolved:
          title: "&aРешённые репорты"
          lore:
            description: "&7Просмотр всех решённых репортов."
            action: "&eНажмите для просмотра!"
        rejected:
          title: "&cОтклонённые репорты"
          lore:
            description: "&7Просмотр всех отклонённых репортов."
            action: "&eНажмите для просмотра!"

      category_view:
        title: "Репорты: {status}"
        report_item:
          title: "<gradient:#AFA3FF:#AFA3FF>{reporter}</gradient> <grey>→ <gradient:#FF0000:#FF0000>{reported}</gradient>"
          lore:
            reason: "<gradient:#AFA3FF:#AFA3FF>Причина:</gradient> <white>{reason}</white>"
            status: "<gradient:#AFA3FF:#AFA3FF>Статус:</gradient> <white>{status}</white>"
            id: "<gradient:#AFA3FF:#AFA3FF>ID:</gradient> <white>{id}</white>"
            server: "<gradient:#AFA3FF:#AFA3FF>Сервер:</gradient> <white>{server}</white>"
            action: "<gradient:#FF0000:#FF0000>Нажмите для управления</gradient>"

      player_reports:
        title: "Ваши репорты"

      reason_selector:
        title: "Репорт: {target}"
        info_icon:
          title: "<gradient:#AFA3FF:#AFA3FF>Репорт на:</gradient> <white>{target}</white>"
          lore:
            - ""
            - "&fВыберите причину репорта"
            - "&fНажмите на любой значок для отправки"
            - ""
        reason_item:
          title: "<gradient:#AFA3FF:#AFA3FF>{reason}</gradient>"
          lore:
            target: " "
            action: "&aНажмите для отправки репорта"
        custom_reason_item:
          title: "&cСвоя причина"
          lore: "&7Нажмите, чтобы ввести свою причину"

    manage_report:
      title: "Управление репортом {id}"
      back_button:
        title: "&cНазад"
        lore: "&7Вернуться к репортам: {status}"
      details:
        title: "<gradient:#AFA3FF:#AFA3FF>Детали репорта</gradient>"
        lore:
          reporter: "<gradient:#AFA3FF:#AFA3FF>Репортёр:</gradient> <white>{reporter}</white>"
          reported: "<gradient:#AFA3FF:#AFA3FF>Нарушитель:</gradient> <white>{reported}"
          reason: "<gradient:#AFA3FF:#AFA3FF>Причина:</gradient> <white>{reason}</white>"
          status: "<gradient:#AFA3FF:#AFA3FF>Статус:</gradient> <white>{status}</white>"
          id: "<gradient:#AFA3FF:#AFA3FF>ID:</gradient> <white>{id}</white>"
          server: "<gradient:#AFA3FF:#AFA3FF>Сервер:</gradient> <white>{server}</white>"
          created_at: "<gradient:#AFA3FF:#AFA3FF>Создан:</gradient> <white>{date}</white>"
          updated_at: "<gradient:#AFA3FF:#AFA3FF>Последнее обновление:</gradient> <white>{date}</white>"
          last_updated_by: "<gradient:#AFA3FF:#AFA3FF>Изменил:</gradient> <white>{name}</white>"
      pending:
        title: "&6Перевести в ожидание"
        lore:
          description: "&7Отметить этот репорт как ожидающий рассмотрения."
          current_status: "&7Текущий статус: &f{status}"
          action: "&6Нажмите для смены статуса"
      resolved:
        title: "&aПеревести в решённые"
        lore:
          description: "&7Отметить этот репорт как решённый."
          current_status: "&7Текущий статус: &f{status}"
          action: "&aНажмите для смены статуса"
      rejected:
        title: "&cПеревести в отклонённые"
        lore:
          description: "&7Отклонить этот репорт как недействительный."
          current_status: "&7Текущий статус: &f{status}"
          action: "&cНажмите для смены статуса"

# Общие строки
# Общие элементы текста, статусы и стандартные причины репортов.
common:
  unknown: "Неизвестно"
  anonymous: "Аноним"
  status:
    pending: "Ожидает"
    resolved: "Решён"
    rejected: "Отклонён"
  reasons:
    - "Читерство/Хаки"
    - "Оскорбления/Травля"
    - "Спам/Реклама"
    - "Гриферство/Вандализм"
    - "Использование багов"
    - "Неприемлемый скин/ник"
    - "Неприемлемые высказывания"
    - "Другое"

# Сообщения чата
# Прямые уведомления, ошибки и успешные сообщения, отправляемые игрокам
# или сотрудникам в стандартный чат Minecraft.
messages:
  # Префикс, отображаемый перед большинством сообщений плагина
  prefix: "<gradient:#AFA3FF:#AFA3FF>Репорты</gradient> <grey>➡</grey>"

  error:
    no-permission: "{prefix} &cУ вас нет прав для этого!"
    player-only: "{prefix} &cЭту команду могут использовать только игроки!"
    invalid-player: "{prefix} &cТакой игрок не существует!"
    invalid-group: "{prefix} &cНеверная группа статуса репорта."
    report-not-found: "{prefix} &cРепорт не найден!"
    no-reports: "{prefix} &cУ вас нет активных репортов!"
    no-status-reports: "{prefix} &cРепортов со статусом {status} не найдено."
    status-invalid: "{prefix} &cНеверный статус репорта! Доступные статусы: {statuses}"
    category-invalid: "{prefix} &cНеверная категория репорта! Доступные категории: {categories}"
    custom-reason-disabled: "{prefix} &cСвои причины сейчас отключены."
    custom-reason-too-short: "{prefix} &cВаша причина слишком короткая! Минимальная длина: {min} символов"
    custom-reason-too-long: "{prefix} &cВаша причина слишком длинная! Максимальная длина: {max} символов"
    usage-report: "&cИспользование: /report <игрок> [причина]"
    usage-viewreport: "&cИспользование: /viewreport <id>"
    usage-setstatus: "&cИспользование: /setreportstatus <id> to <статус>"
    usage-reload: "&cИспользование: /{command} reload <all|config|lang>"
    invalid-report-id: "&cНеверный ID репорта!"
    status-already-set: "&cРепорт уже находится в этом статусе!"
    cannot-report-self: "&cВы не можете отправить репорт на самого себя."

  success:
    report-created: "{prefix} &aВаш репорт был успешно отправлен!"

  report:
    cooldown: "{prefix} &cВы должны подождать {time} перед отправкой следующего репорта."
    limit-reached: "{prefix} &cВы достигли максимального количества активных репортов."
    notification: "{prefix} <gradient:#BEFF00:#D2FF00>{reporter}</gradient> &fотправил репорт на <gradient:#FF0000:#FF003E>{reported}</gradient> &fза: <gradient:#00B7FF:#0098FF>{category}</gradient>"
    status-change: "{prefix} &7Статус репорта #{id} был изменён на {color}{status}&7."
    custom-reason-prompt: "{prefix} &fВведите свою причину в чат. Ваше сообщение будет приватным."

  admin:
    reload-success: "{prefix} &aКонфигурация успешно перезагружена!"
    reload-all-success: "{prefix} &aВся конфигурация и языковые файлы успешно перезагружены!"
    reload-config-success: "{prefix} &aКонфигурация успешно перезагружена!"
    reload-lang-success: "{prefix} &aЯзыковые файлы успешно перезагружены!"
    reload-failure: "{prefix} &cНе удалось перезагрузить конфигурацию. Проверьте консоль."

