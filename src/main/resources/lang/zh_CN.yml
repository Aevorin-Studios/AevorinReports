messages:
  prefix: "<gradient:#AFA3FF:#AFA3FF>举报</gradient> <grey>➡</grey>"

  error:
    no-permission: "&c你没有执行此操作的权限！"
    player-only: "&c仅游戏内玩家可使用该指令！"
    invalid-player: "&c找不到该玩家！"
    invalid-group: "&c无效的举报状态类型。"
    report-not-found: "&c未找到该举报工单！"
    no-reports: "&c你当前没有举报记录！"
    no-status-reports: "&c暂无{status}的举报。"
    invalid-status-transition: "&c无法将举报状态从{current}改为{status}，不支持该状态变更！"
    status-invalid: "&c无效状态！可用状态：{statuses}"
    description-too-short: "&c举报内容过短！最少需要{min}个字"
    description-too-long: "&c举报内容过长！最多允许{max}个字"
    category-invalid: "&c无效举报类型！可选类型：{categories}"
    custom-reason-disabled: "&c自定义举报理由功能已关闭。"
    custom-reason-too-short: "&c自定义理由字数不足！最少{min}字符"
    custom-reason-too-long: "&c自定义理由超出上限！最多{max}字符"
    book-meta-error: "&c创建书本界面失败。"
    usage-report: "&c用法：/report <玩家> [理由]"
    usage-viewreport: "&c用法：/viewreport <编号>"
    usage-setstatus: "&c用法：/setreportstatus <编号> to <状态>"
    usage-reload: "&c用法: /{command} reload <all|config|lang>"
    invalid-report-id: "&c无效的举报编号！"
    status-already-set: "&c该举报已处于此状态！"
    cannot-report-self: "&c你不能举报自己！"

  success:
