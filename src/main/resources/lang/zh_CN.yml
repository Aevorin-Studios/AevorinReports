    notification: "&c[举报通知] &e{reporter} &f举报了 &c{reported} &f，类型：&e{category}"
    status-change: "&7举报#{id}状态已变更为 {color}{status}&7。"
    custom-reason-prompt: "&e在聊天框输入自定义理由，该消息仅管理员可见。"
    title: "&6我的有效举报"
    format: "&7• &e#{id} &7- &f{reason}"
    details: "&7当前状态: &e{status}\n&7提交时间: &f{date}"

  admin:
    reload-success: "{prefix} &a配置重载成功！"
    reload-all-success: "{prefix} &a所有配置文件和语言文件已成功重载！"
    reload-config-success: "{prefix} &a配置文件已成功重载！"
    reload-lang-success: "{prefix} &a语言文件已成功重载！"
